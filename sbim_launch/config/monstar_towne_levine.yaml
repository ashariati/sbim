# initial synchronization
scan_aggregator:
  ros__parameters:
    duration: 0.2
    sensor_calibration: [0.00433407704, 0.99985672803, 0.01636273763, 0.13084133258,
                         0.99997086446, -0.00443623317, 0.00621209107, -0.05830980169,
                         0.00628378997, 0.01633533722, -0.99984682363, -0.01167565079,
                         0.00000000000, 0.00000000000, 0.00000000000, 1.00000000000]

# compass
point_cloud_compass_node:
  ros__parameters:
    manhattan_world: true

# scene parsing
plane_detector_node:
  ros__parameters:
    scan_range: 10.0
    min_intensity: 8000.0

layout_extractor_node:
  ros__parameters:
    min_cluster_size: 700
    distance_threshold: 0.15
    cluster_tolerance: 0.4
    filter_leaf_size: 0.03

# SLAM
planar_slam_node:
  ros__parameters:
    pose_window: 50
    sigma_t: 0.02
    sigma_d: 0.04
    association_range: 0.3

# floorplan estimation
floorplan_estimation_node:
  ros__parameters:
    speculation_horizon: 0
    min_free_ratio: 0.0
    boundary_coverage_threshold: 1.5
    boundary_height_threshold: 2.5

# visualization
floorplan_visualization:
  ros__parameters:
    boundary_height: 1.0
    draw_graph: false

layout_cloud_transformer:
  ros__parameters:
    cloud_window: 50

object_cloud_transformer:
  ros__parameters:
    cloud_window: 50